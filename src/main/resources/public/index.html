<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Recados</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>Mural de Recados</h1>
        <p>Front + Java + JDBC + MySQL</p>
    </header>

    <main>
        <form id="form-recado">
            <label for="autor">Nome do Autor</label>
            <input id="autor" name="autor" maxlength="80" type="text" required>

            <label for="mensagem">Recado</label>
            <textarea id="mensagem" name="mensagem" maxlength="255" type="text" required>
            </textarea>

            <button type="submit">Publicar recado</button>
        </form>
        <p id="aviso"></p>
        <h2>Recados publicados</h2>

        <div class="btns">
            <button id="mostrar" onclick="carregarRecados()">Show</button>
        </div>


        <section class="lista-recados" id="lista-recados">

        </section>
    </main>
</body>
<script src="./script.js"></script>

</html>
